<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Courier+Prime:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--h:'IM Fell English',serif;--b:'Courier Prime',monospace;--num:'Caveat',cursive;--teal:#2f9493;--gold:#cca45b;--deep:#1d414a;--ivory:#fdf5df}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1280px;height:720px;overflow:hidden}
body{position:relative;font-family:var(--b);color:var(--deep)}
.scene{position:absolute;inset:0;width:100%;height:100%}
.ic{display:block;flex:none}.ab{position:absolute}

.panel{position:absolute;background:#f4e8c8;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(47,148,147,.28) 31px 32px);border:2px solid #7d6a3e;border-radius:3px 10px 10px 3px;padding:30px 36px 26px 70px;box-shadow:6px 8px 0 rgba(29,65,74,.28);font-family:var(--b)}
.panel:before{content:"";position:absolute;left:46px;top:0;bottom:0;width:2px;background:rgba(163,65,47,.55)}
.panel:after{content:"";position:absolute;left:12px;top:0;bottom:0;width:14px;background:radial-gradient(circle,#2a3b3c 0 5px,transparent 5.5px) 0 40px/14px 120px repeat-y}
.ptitle{position:absolute;top:-18px;left:70px;background:var(--deep);color:#f4e8c8;font-family:var(--h);font-style:italic;font-size:26px;padding:4px 20px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.btn{font-family:var(--b);font-weight:700;font-size:17px;min-height:46px;padding:0 24px;background:#f9f0d6;color:var(--deep);border:2px solid var(--deep);border-radius:2px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:3px 3px 0 var(--deep)}
.btn.pri{background:var(--teal);color:#fff9e6}.btn.off{border-style:dashed;color:#9aa;box-shadow:none;background:transparent}
.btn.pressed{box-shadow:0 0 0 var(--deep);transform:translate(3px,3px)}
.chip{font-family:var(--num);font-weight:700;font-size:30px;height:50px;display:flex;align-items:center;justify-content:center;color:#6d7f7e;border:2px dashed #a99f7d;border-radius:2px;position:relative}
.chip.on{color:var(--deep);border:2px solid var(--deep);background:#fbf4de}
.chip.on:after{content:"";position:absolute;inset:-3px -6px;border:3px solid #a3412f;border-radius:50%;transform:rotate(-4deg);opacity:.85;clip-path:polygon(0 0,100% 0,100% 80%,0 100%)}
.paper{background:#fbf4de;border:2px solid #7d6a3e}
.lbl{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6d6a55}
.bal{display:flex;align-items:center;gap:10px;font-family:var(--num);font-weight:700;font-size:32px;color:var(--deep)}
.bal small{font-family:var(--b);font-size:11px;font-weight:700;letter-spacing:.14em;display:block;color:#6d6a55;line-height:1}
.nav{display:flex;align-items:center;justify-content:center;height:92px;width:44px;background:#e8d9ae;border:2px solid #7d6a3e;border-left:0;border-radius:0 10px 10px 0;color:var(--deep);writing-mode:vertical-rl;font-family:var(--b);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;gap:6px;box-shadow:3px 3px 0 rgba(29,65,74,.25)}
.nav.act{background:var(--teal);color:#fff9e6;width:54px}
.row{display:grid;align-items:center;padding:0 10px;height:32px;font-size:14px;font-weight:700}
.row.me{background:rgba(204,164,91,.45);box-shadow:inset 0 0 0 2px #a3412f}
.stamp{display:inline-block;border:3px solid #a3412f;color:#a3412f;font-family:var(--b);font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:2px 10px;transform:rotate(-6deg);border-radius:3px;font-size:14px}
input.f{font-family:var(--num);font-weight:700;font-size:28px;height:44px;width:100%;border:0;border-bottom:2px solid var(--deep);background:transparent;color:var(--deep);padding:0 4px}
@media(max-width:900px){.nav{height:74px;width:48px}}

</style></head><body class="cC"><svg class="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3dbe2"/><stop offset="1" stop-color="#f4e8c8"/></linearGradient></defs>

<div style="font-family:var(--num);font-size:32px;font-weight:700;line-height:1">Milo Brook</div><div style="margin:6px 0 16px;font-weight:700;font-size:15px">would like your support</div>
<div style="display:flex;gap:12px"><div class="btn pri" style="flex:1">Accept</div><div class="btn" style="flex:1">Decline</div></div></div></body></html>
