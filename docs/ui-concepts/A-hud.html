<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Chivo:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--h:'Alfa Slab One',serif;--b:'Chivo',sans-serif;--num:'Chivo',sans-serif;--teal:#2f9493;--gold:#cca45b;--deep:#1d414a;--ivory:#fdf5df}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1280px;height:720px;overflow:hidden}
body{position:relative;font-family:var(--b);color:var(--deep)}
.scene{position:absolute;inset:0;width:100%;height:100%}
.ic{display:block;flex:none}.ab{position:absolute}

.panel{position:absolute;background:var(--teal);background-image:repeating-linear-gradient(0deg,rgba(29,65,74,.18) 0 2px,transparent 2px 58px);border:7px solid var(--deep);border-radius:8px;box-shadow:inset 0 0 0 3px var(--gold),0 10px 0 rgba(29,65,74,.25);padding:26px 28px 24px;color:var(--ivory)}
.panel:before,.panel:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f3dca0,#8a6420);top:10px;left:10px;box-shadow:0 0 0 1px #5b4212}
.panel:after{left:auto;right:10px}
.ptitle{position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:var(--ivory);color:var(--deep);font-family:var(--h);font-size:22px;letter-spacing:.04em;padding:8px 26px;border:3px solid var(--deep);border-radius:4px;white-space:nowrap;box-shadow:0 4px 0 rgba(29,65,74,.3)}
.btn{font-family:var(--h);font-size:19px;min-height:46px;padding:0 22px;background:var(--ivory);color:var(--deep);border:3px solid var(--deep);border-radius:6px;box-shadow:0 5px 0 var(--deep);display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative}
.btn.pri{background:var(--gold)}.btn.off{background:#c9c3ae;color:#7b8a8a;box-shadow:0 2px 0 #5d6d6d;border-color:#5d6d6d;transform:translateY(3px)}
.btn.pressed{transform:translateY(4px);box-shadow:0 1px 0 var(--deep)}
.chip{font-family:var(--h);font-size:19px;height:48px;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(29,65,74,.55);color:#bfe3e0;border:3px dashed rgba(253,245,223,.45)}
.chip.on{background:var(--ivory);color:var(--deep);border:3px solid var(--deep);box-shadow:0 4px 0 var(--deep)}
.chip.on:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--deep)}
.paper{background:var(--ivory);color:var(--deep);border:3px solid var(--deep);border-radius:4px}
.lbl{font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#e9dcb8}
.bal{display:flex;align-items:center;gap:10px;font-family:var(--h);font-size:26px;background:var(--ivory);color:var(--deep);border:4px solid var(--deep);border-radius:6px;padding:6px 16px 6px 10px;box-shadow:0 5px 0 rgba(29,65,74,.35);min-width:190px}
.bal small{font-family:var(--b);font-size:11px;font-weight:800;letter-spacing:.12em;display:block;color:#5d7a7c;line-height:1}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:96px;height:78px;background:var(--teal);color:var(--ivory);border:4px solid var(--deep);border-radius:6px;box-shadow:inset 0 0 0 2px var(--gold),0 5px 0 rgba(29,65,74,.4);font-family:var(--h);font-size:13px;letter-spacing:.05em}
.row{display:grid;align-items:center;padding:0 14px;height:40px;font-weight:600;font-size:15px}
.row:nth-child(even){background:#f3e8c9}.row.me{background:var(--gold);font-weight:800;outline:3px solid var(--deep);outline-offset:-3px}
.hang{position:absolute;top:0;width:3px;height:30px;background:repeating-linear-gradient(#c9a46a 0 4px,#8d6b36 4px 7px)}
input.f{font-family:var(--b);font-weight:600;font-size:18px;height:46px;width:100%;border:3px solid var(--deep);border-radius:4px;background:var(--ivory);padding:0 12px;color:var(--deep)}
.paper .lbl{color:#4d6f72}
@media(max-width:900px){.nav{width:80px;height:66px;font-size:12px}.bal{font-size:22px;min-width:150px}}
